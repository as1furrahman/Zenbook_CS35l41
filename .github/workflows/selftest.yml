name: Self-Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run CI (lint + test suite)
        run: |
          make ci

      - name: Verify CLI flags
        run: |
          bash speakers.sh --version
          bash speakers.sh --help
          bash speakers.sh --status
