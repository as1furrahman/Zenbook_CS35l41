name: Self-Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n speakers.sh
          bash -n tests/helper-selftest.sh

      - name: Run test suite
        run: |
          bash tests/helper-selftest.sh

      - name: Verify CLI flags
        run: |
          bash speakers.sh --version
          bash speakers.sh --help
          bash speakers.sh --status
          bash speakers.sh --test
